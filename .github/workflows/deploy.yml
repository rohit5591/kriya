name: Deploy the moved-to notice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app itself now lives on Cloudflare, behind a sign-in, with the
      # recordings in a private bucket. All Pages serves is a notice
      # pointing old bookmarks at the new address — deliberately not the
      # app, and deliberately without public/audio, which is what used to
      # make every recording downloadable by anyone with the link.
      - name: Upload the moved-to notice
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-notice

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the moved-to notice to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
